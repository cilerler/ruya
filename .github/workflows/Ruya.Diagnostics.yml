name: Ruya.Diagnostics

on:
  workflow_dispatch:
    inputs:
      rollingDeployment:
        type: boolean
        description: 'Initiate rolling deployment (chain builds)'
        default: false

  repository_dispatch:
    types: [Ruya.Primitives, Ruya.Extensions.DependencyInjection, Ruya.Diagnostics.Abstractions]

jobs:
  build:
    uses: ./.github/workflows/dotnet-library-build.yml
    with:
      project-name: 'Ruya.Diagnostics'
      project-path: './src/Ruya.Diagnostics/Ruya.Diagnostics.csproj'
      test-project-paths: './tests/Ruya.Diagnostics.Unit.Tests/Ruya.Diagnostics.Unit.Tests.csproj'
      test-configuration: 'Debug'
      dispatch-event-type: 'Ruya.Diagnostics'
      triggered-branch: ${{ github.event.client_payload.branch || '' }}
      use-testcontainers: false
    secrets:
      PAT: ${{ secrets.PAT }}  # Required for dispatch (chain builds)
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
