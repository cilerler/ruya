name: Ruya.Extensions.DependencyInjection

on:
  workflow_dispatch:
    inputs:
      rollingDeployment:
        type: boolean
        description: 'Initiate rolling deployment (chain builds)'
        default: false

  repository_dispatch:
    types: []

  push:
    branches: [main, release-preview, release-qa, develop]
    paths:
      - '.github/workflows/Ruya.Extensions.DependencyInjection.yml'
      - 'src/Ruya.Extensions.DependencyInjection/**'
      - 'tests/Ruya.Extensions.DependencyInjection.Unit.Tests/**'

jobs:
  build:
    uses: ./.github/workflows/dotnet-library-build.yml
    with:
      project-name: 'Ruya.Extensions.DependencyInjection'
      project-path: './src/Ruya.Extensions.DependencyInjection/Ruya.Extensions.DependencyInjection.csproj'
      test-project-paths: './tests/Ruya.Extensions.DependencyInjection.Unit.Tests/Ruya.Extensions.DependencyInjection.Unit.Tests.csproj'
      dispatch-event-type: 'Ruya.Extensions.DependencyInjection'
      triggered-branch: ${{ github.event.client_payload.branch || '' }}
    secrets:
      PAT: ${{ secrets.PAT }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
