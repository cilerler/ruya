name: Ruya.Services.DistributedLock

on:
  workflow_dispatch:
    inputs:
      rollingDeployment:
        type: boolean
        description: 'Initiate rolling deployment (chain builds)'
        default: false

  repository_dispatch:
    types: [Ruya.Primitives, Ruya.Services.DistributedLock.Abstractions]

  push:
    branches: [main, release-preview, release-qa, develop]
    paths:
      - '.github/workflows/Ruya.Services.DistributedLock.yml'
      - 'src/Ruya.Services.DistributedLock.Abstractions/**'
      - 'src/Ruya.Services.DistributedLock/**'
      - 'tests/Ruya.Services.DistributedLock.Unit.Tests/**'

jobs:
  build:
    uses: ./.github/workflows/dotnet-library-build.yml
    with:
      project-name: 'Ruya.Services.DistributedLock'
      project-path: './src/Ruya.Services.DistributedLock/Ruya.Services.DistributedLock.csproj'
      test-project-paths: |
        ./tests/Ruya.Services.DistributedLock.Unit.Tests/Ruya.Services.DistributedLock.Unit.Tests.csproj
        ./tests/Ruya.Services.DistributedLock.InMemory.Unit.Tests/Ruya.Services.DistributedLock.InMemory.Unit.Tests.csproj
        ./tests/Ruya.Services.DistributedLock.Redis.Integration.Tests/Ruya.Services.DistributedLock.Redis.Integration.Tests.csproj
        ./tests/Ruya.Services.DistributedLock.MsSql.Integration.Tests/Ruya.Services.DistributedLock.MsSql.Integration.Tests.csproj
      test-configuration: 'Debug'
      dispatch-event-type: 'Ruya.Services.DistributedLock'
      triggered-branch: ${{ github.event.client_payload.branch || '' }}
      use-testcontainers: true
    secrets:
      PAT: ${{ secrets.PAT }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
