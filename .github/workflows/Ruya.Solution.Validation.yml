name: Ruya Solution Validation

on:
  workflow_dispatch:
    inputs:
      runUnitTests:
        type: boolean
        description: 'Run every unit-test project after the solution build'
        default: false

  pull_request:
    branches: [main, release-preview, release-qa, develop]
    paths:
      - '.github/workflows/Ruya.Solution.Validation.yml'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'Ruya.slnx'

  push:
    branches: [main, release-preview, release-qa, develop]
    paths:
      - '.github/workflows/Ruya.Solution.Validation.yml'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'Ruya.slnx'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate solution build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Solution
        run: dotnet restore './Ruya.slnx' -p:Configuration=Debug

      - name: Build Solution
        run: dotnet build './Ruya.slnx' --configuration Debug --no-restore

      - name: Run Unit Tests (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.runUnitTests
        shell: pwsh
        run: |
          $testProjects = @(
            Get-ChildItem './tests' -Directory |
              Where-Object { $_.Name -like '*.Unit.Tests' } |
              ForEach-Object { Get-ChildItem $_.FullName -Filter '*.csproj' -File }
          )

          if ($testProjects.Count -eq 0) {
            throw 'No unit-test projects were found.'
          }

          $failedProjects = @()
          foreach ($testProject in $testProjects) {
            Write-Host "`n===== Testing: $($testProject.FullName) =====" -ForegroundColor Cyan
            dotnet test `
              --project $testProject.FullName `
              --configuration Debug `
              --no-build `
              --no-restore `
              --verbosity normal

            if ($LASTEXITCODE -ne 0) {
              $failedProjects += $testProject.FullName
            }
          }

          if ($failedProjects.Count -gt 0) {
            throw "Unit-test projects failed: $($failedProjects -join ', ')"
          }
