# Example only. Replace every placeholder and use an external secret operator in production.
apiVersion: v1
kind: Secret
metadata:
  name: token-service-secrets
  namespace: ruya
type: Opaque
stringData:
  signing-private-key.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_RSA_PRIVATE_KEY
    -----END PRIVATE KEY-----
  redis-connection-string: "REPLACE_WITH_SECRET_REDIS_CONNECTION_STRING"
  kestrel-certificate-password: "REPLACE_WITH_CERTIFICATE_PASSWORD"
data:
  # Replace with the base64-encoded PKCS#12 certificate bytes.
  tls.pfx: UkVQTEFDRV9XSVRIX0JBU0U2NF9QS0NTMTI=
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: token-service-config
  namespace: ruya
data:
  appsettings.json: |
    {
      "TokenBroker": {
        "Issuer": "ruya-token-service",
        "Audiences": ["ruya-api", "ruya-services"],
        "SigningKeyId": "token-key-2026-08",
        "SigningPublicKeys": {
          "token-key-2026-08": "-----BEGIN PUBLIC KEY-----\nREPLACE_WITH_RSA_PUBLIC_KEY\n-----END PUBLIC KEY-----"
        },
        "TokenLifetime": "00:15:00",
        "ClockSkew": "00:00:30",
        "ApiKeyCacheDuration": "00:05:00"
      },
      "DistributedLock": {
        "Redis": {
          "ConnectionStringKey": "Redis"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-service
  namespace: ruya
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: token-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: token-service
          image: ghcr.io/your-organization/token-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: ASPNETCORE_URLS
              value: "https://+:8443"
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: "/https/tls.pfx"
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef:
                  name: token-service-secrets
                  key: kestrel-certificate-password
            - name: TokenBroker__SigningPrivateKeyPem
              valueFrom:
                secretKeyRef:
                  name: token-service-secrets
                  key: signing-private-key.pem
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: token-service-secrets
                  key: redis-connection-string
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.json
              subPath: appsettings.json
              readOnly: true
            - name: certificate
              mountPath: /https
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: token-service-config
        - name: certificate
          secret:
            secretName: token-service-secrets
            items:
              - key: tls.pfx
                path: tls.pfx
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: token-service
  namespace: ruya
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: token-service
  ports:
    - name: https
      port: 443
      targetPort: https
